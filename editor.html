<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LibreOffice editor</title>
<!-- One live LibreOffice document, editable by the user (tiles + mouse/keyboard) and by the
     agent (UNO operations on the same document) at the same time. One iframe per open file
     (libreoffice.js, mountEditor). LibreOfficeKit runs on the cooperative
     threads (coop.js), so the page needs no cross-origin isolation.
     Every LibreOfficeKit / UNO call runs on the "LOK thread": the pthread callMain() starts,
     taken over through the glue's __coopEntryHook (build/patchglue.cjs). A wait on the page
     thread would busy-spin; on a pthread it suspends. Calls go through ONE queue because they
     share that thread's stack.
     postMessage protocol with the parent:
       editor → parent  {type:'lok-ready'}
       parent → editor  {type:'lok-open', name, bytes:ArrayBuffer}
       editor → parent  {type:'lok-opened', docType:'text'|'spreadsheet'|'presentation'|'drawing', parts}
                        {type:'lok-failed', error}
                        {type:'lok-modified', modified:bool}
                        {type:'lok-save-request'}                      (Ctrl+S in the editor)
       parent → editor  {type:'lok-call', id, op, args}
       editor → parent  {type:'lok-reply', id, ok, value, error, bytes?}
     ops: save, read, replace, insert, set_cells, command (see ops below). -->
<style>
  :root { color-scheme: light dark; --bg: #e8eaed; --bar: #f7f7f8; --fg: #1d1d1f; --mut: #6e6e73; --line: #d2d2d7; --on: #dbe6f6; --acc: #0a66c2; }
  @media (prefers-color-scheme: dark) { :root { --bg: #2b2d31; --bar: #1e1f22; --fg: #e8e8ea; --mut: #a1a1a6; --line: #3a3b3f; --on: #2c3e57; --acc: #4c9be8; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px system-ui, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  #bar { flex: none; display: flex; gap: 2px; align-items: center; padding: 3px 6px; background: var(--bar); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  #bar button, #bar select { font: inherit; height: 26px; min-width: 28px; border: 1px solid transparent; border-radius: 5px; background: transparent; color: var(--fg); cursor: pointer; padding: 0 6px; }
  #bar button:hover { border-color: var(--line); }
  #bar button.on { background: var(--on); }
  #bar button:disabled { opacity: .4; cursor: default; }
  #bar select { border-color: var(--line); background: var(--bar); }
  .sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
  #status { margin-left: auto; color: var(--mut); font-size: 12px; padding-right: 4px; white-space: nowrap; }
  #fbar { flex: none; display: flex; gap: 6px; align-items: center; padding: 3px 6px; background: var(--bar); border-bottom: 1px solid var(--line); }
  #fbar[hidden] { display: none; }
  #fbar input { font: 12px ui-monospace, monospace; height: 22px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); padding: 0 6px; box-sizing: border-box; }
  #addr { width: 80px; }
  #formula { flex: 1; min-width: 0; }
  .fx { color: var(--mut); font-style: italic; }
  #main { flex: 1; min-height: 0; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto 1fr; }
  #corner, #colhdr, #rowhdr { display: block; background: var(--bar); }
  #corner { grid-area: 1 / 1; } #colhdr { grid-area: 1 / 2; cursor: s-resize; } #rowhdr { grid-area: 2 / 1; cursor: e-resize; }
  #corner[hidden], #colhdr[hidden], #rowhdr[hidden] { display: none; }
  #scroller { grid-area: 2 / 2; min-width: 0; min-height: 0; position: relative; overflow: auto; outline: none; }
  #sizer { position: relative; }
  #view { position: absolute; left: 0; top: 0; display: block; cursor: text; }
  #overlay { position: absolute; left: 0; top: 0; pointer-events: none; }
  .cur { position: absolute; width: 2px; background: currentColor; color: #000; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .selr { position: absolute; background: rgba(66, 133, 244, .28); }
  .cellc { position: absolute; border: 2px solid #1a73e8; box-sizing: border-box; }
  .gsel { position: absolute; border: 1px dashed #1a73e8; box-sizing: border-box; }
  /* the agent's own view: its cursor and selection, in orange */
  .ai-cur { position: absolute; width: 2px; background: #f08c00; }
  .ai-cur::after { content: 'AI'; position: absolute; left: 0; top: -13px; font: 600 9px/12px system-ui, sans-serif; color: #fff; background: #f08c00; padding: 0 3px; border-radius: 2px; }
  .ai-sel { position: absolute; background: rgba(240, 140, 0, .25); }
  .ai-cell { position: absolute; border: 2px dashed #f08c00; box-sizing: border-box; }
  #ime { position: absolute; left: -1000px; top: 0; width: 20px; height: 20px; opacity: 0; }
  #msg[hidden] { display: none; }
  #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--mut); pointer-events: none; }
</style>
</head>
<body>
<div id="bar">
  <button id="undo" title="Undo (Ctrl+Z)" disabled>↶</button>
  <button id="redo" title="Redo (Ctrl+Y)" disabled>↷</button>
  <span class="sep"></span>
  <button id="bold" title="Bold (Ctrl+B)"><b>B</b></button>
  <button id="italic" title="Italic (Ctrl+I)"><i>I</i></button>
  <button id="underline" title="Underline (Ctrl+U)"><u>U</u></button>
  <span class="sep"></span>
  <select id="part" title="Slide / sheet" hidden></select>
  <button id="zout" title="Zoom out">−</button>
  <button id="zin" title="Zoom in">+</button>
  <span id="status">Starting LibreOffice…</span>
</div>
<div id="fbar" hidden><input id="addr" spellcheck="false" title="Cell or range — Enter goes there"><span class="fx">fx</span><input id="formula" spellcheck="false" title="Cell content — Enter sets it, Esc cancels"></div>
<div id="main">
  <canvas id="corner" hidden></canvas><canvas id="colhdr" hidden></canvas><canvas id="rowhdr" hidden></canvas>
  <div id="scroller" tabindex="-1">
    <div id="sizer"><canvas id="view"></canvas><div id="overlay"></div></div>
    <div id="msg">Starting LibreOffice…</div>
  </div>
</div>
<textarea id="ime" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
<canvas id="qtcanvas" style="display:none"></canvas>
<script src="coop.js"></script>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const V = new URLSearchParams(location.search).get('v') || '1';
  const BIN = 'bin/';
  const post = (m, tr) => parent.postMessage(m, '*', tr || []);
  const log = window.__loLog = [];
  const status = (t) => { $('status').textContent = t; };
  const say = (t) => { log.push(t); if (log.length > 400) log.splice(0, 100); };

  // ---- the LibreOffice runtime --------------------------------------------------------
  let W = null;                 // the LOK thread's realm (an iframe window, coop.js)
  let kit = 0, kcls = 0, doc = 0, dcls = 0;
  const S = { docType: -1, parts: 1, part: 0, size: [0, 0], zoom: 1, modified: false, ext: '', name: '', userView: 0, aiView: -1 };
  const TYPES = ['text', 'spreadsheet', 'presentation', 'drawing'];
  // LibreOfficeKitClass / LibreOfficeKitDocumentClass slots (include/LibreOfficeKit/LibreOfficeKit.h)
  const K = { documentLoad: 2, getError: 3 };
  const D = { saveAs: 2, getDocumentType: 3, getParts: 4, getPart: 6, setPart: 7, getPartName: 8, paintTile: 10, getDocumentSize: 12,
    initializeForRendering: 13, registerCallback: 14, postKeyEvent: 15, postMouseEvent: 16, postUnoCommand: 17, getTextSelection: 19, paste: 20,
    getCommandValues: 23, setClientZoom: 24, setClientVisibleArea: 25, createView: 26, setView: 28, getView: 29 };

  window.Module = {
    noInitialRun: true,
    locateFile: (p) => new URL(BIN + p + '?v=' + V, location.href).href,
    mainScriptUrlOrBlob: new Blob(["importScripts('" + new URL(BIN + 'soffice.js?v=' + V, location.href).href + "');"], { type: 'text/javascript' }),
    print: (t) => say(String(t)),
    printErr: (t) => { t = String(t); if (!/^warn:|^info:|unsupported syscall/.test(t)) say(t); },
    preRun: [() => { FS.mkdirTree('/tmp/in'); FS.mkdirTree('/tmp/out'); }],
    onRuntimeInitialized: () => { runtimeUp(); },
    onAbort: (w) => fail('LibreOffice stopped: ' + w),
  };
  let runtimeUp; const runtimeReady = new Promise((r) => { runtimeUp = r; });

  // Every LOK/UNO call goes through this queue (one stack on the LOK thread).
  let chain = Promise.resolve();
  // With two views, LibreOffice may make the other one current on its own (activation events
  // from the main loop), so every job starts on the user's view (the agent's select job
  // switches to its own view inside, and back).
  const queue = (fn) => { const p = chain.then(async () => { if (doc && S.aiView >= 0) await dcall(D.setView, S.userView); return fn(); }); chain = p.catch(() => {}); return p; };
  const fnAt = (vt, i) => W.getWasmTableEntry(HEAPU32[(vt >> 2) + i]);
  const P = (f) => WebAssembly.promising(f);
  const kcall = (i, ...a) => P(fnAt(kcls, i))(kit, ...a);
  const dcall = (i, ...a) => P(fnAt(dcls, i))(doc, ...a);
  const cstr = (s) => { const b = new TextEncoder().encode(String(s) + '\0'); const p = W._malloc(b.length); HEAPU8.set(b, p); return p; };
  const withStrs = async (strs, fn) => { const ps = strs.map((s) => (s == null ? 0 : cstr(s))); try { return await fn(...ps); } finally { ps.forEach((p) => p && W._free(p)); } };

  // A JS function in the wasm table of EVERY realm at the same index (callbacks may come
  // from any LibreOffice thread). Realms not up yet get it from the glue's instance hook.
  const tableFns = [];
  let cbIndex = 0;   // onCallback's table index, the same in every realm
  function addToRealm(w) {
    if (!w.wasmTable || !w.addFunction) return;
    while ((w.__coopAdded || 0) < tableFns.length) {
      const [fn, sig, idx] = tableFns[w.__coopAdded || 0];
      const got = w.addFunction(fn, sig);
      if (got !== idx) say('table index mismatch in a thread realm: ' + got + ' != ' + idx);
      w.__coopAdded = (w.__coopAdded || 0) + 1;
    }
  }
  // Count LibreOffice main-loop iterations (the glue sets __coopLoopBusy around each one).
  function countIterations(w) {
    if (w.__coopIterHooked) return; w.__coopIterHooked = true;
    let b = false;
    Object.defineProperty(w, '__coopLoopBusy', { configurable: true, get: () => b, set: (v) => { if (b && !v) { w.__coopIters = (w.__coopIters || 0) + 1; lastIterAt = performance.now(); } b = !!v; } });
  }
  let lastIterAt = 0;
  const iterations = () => (window.__coopRealms || []).reduce((n, w) => n + (w.__coopIters || 0), 0);
  window.__coopOnInstance = (w) => { countIterations(w); addToRealm(w); };
  function coopAddFunction(fn, sig) {
    const idx = addFunction(fn, sig);
    tableFns.push([fn, sig, idx]);
    for (const w of window.__coopRealms || []) addToRealm(w);
    return idx;
  }

  async function boot() {
    await runtimeReady;
    if (typeof WebAssembly.Suspending !== 'function') throw new Error('this browser has no WebAssembly JSPI, which the editor needs');
    for (const w of window.__coopRealms || []) countIterations(w);
    W = await new Promise((resolve) => { window.__coopEntryHook = (w) => { window.__coopEntryHook = null; resolve(w); return true; }; callMain([]); });
    kit = await withStrs(['/instdir/program'], (p) => P(W.wasmExports.libreofficekit_hook_2)(p, 0));
    if (!kit) throw new Error('LibreOfficeKit did not start');
    kcls = HEAPU32[kit >> 2];
  }

  async function openDoc(name, bytes) {
    S.name = name.replace(/[^A-Za-z0-9._-]/g, '_') || 'document';
    S.ext = (S.name.split('.').pop() || '').toLowerCase();
    FS.writeFile('/tmp/in/' + S.name, new Uint8Array(bytes));
    status('Opening…');
    await queue(async () => {
      doc = await withStrs(['file:///tmp/in/' + S.name, 'Language=en-US'], (u, o) => kcall(4 /* documentLoadWithOptions */, u, o));
      if (!doc) { const e = await kcall(K.getError); throw new Error('LibreOffice could not open ' + name + (e ? ': ' + UTF8ToString(e) : '')); }
      dcls = HEAPU32[doc >> 2];
      await withStrs(['{}'], (a) => dcall(D.initializeForRendering, a));
      if (!cbIndex) cbIndex = coopAddFunction(onCallback, 'viii');
      await dcall(D.registerCallback, cbIndex, 0);
      S.docType = await dcall(D.getDocumentType);
      S.parts = await dcall(D.getParts);
      S.part = await dcall(D.getPart);
      // the agent gets a view of its own (its own cursor and selection, drawn in orange), so
      // its commands never move the user's cursor; every call then goes back to the user's view
      S.userView = await dcall(D.getView);
      S.aiView = await dcall(D.createView);
      await dcall(D.setView, S.userView);
    });
    const calc = S.docType === 1;
    $('fbar').hidden = !calc; ['corner', 'colhdr', 'rowhdr'].forEach((id) => { $(id).hidden = !calc; });
    await refreshSize();
    await fillParts();
    // pages and slides start at the zoom that fits their width in the pane (never above
    // 100%); a spreadsheet's grid has no page width, so it stays at 100%
    if (S.size[0] > 0 && S.docType !== 1) S.zoom = Math.max(0.25, Math.min(1, (scroller.clientWidth - 16) / (S.size[0] / 15)));
    if (S.zoom !== 1) await queue(async () => { const t = Math.round(256 * 15 / S.zoom); await dcall(D.setClientZoom, 256, 256, t, t); });
    $('msg').hidden = true;
    status('');
    layout();
    $('ime').focus();
    return { docType: TYPES[S.docType] || 'other', parts: S.parts };
  }

  async function refreshSize() {
    await queue(async () => {
      const p = W._malloc(16);
      try { HEAP32[p >> 2] = 0; HEAP32[(p >> 2) + 1] = 0; await dcall(D.getDocumentSize, p, p + 4); S.size = [HEAP32[p >> 2], HEAP32[(p >> 2) + 1]]; }
      finally { W._free(p); }
    });
  }
  async function fillParts() {
    const sel = $('part');
    if (S.parts < 2 && S.docType === 0) { sel.hidden = true; return; }
    const names = await queue(async () => { const out = []; for (let i = 0; i < S.parts; i++) { const s = await dcall(D.getPartName, i); out.push(s ? UTF8ToString(s) : ''); if (s) W._free(s); } return out; });
    sel.innerHTML = '';
    names.forEach((n, i) => { const o = document.createElement('option'); o.value = i; o.textContent = (S.docType === 2 ? 'Slide ' + (i + 1) : n || 'Sheet ' + (i + 1)); sel.appendChild(o); });
    sel.value = String(S.part); sel.hidden = S.parts < 2;
  }

  // ---- view: twips <-> css px, painting -----------------------------------------------
  const scroller = $('scroller'), sizer = $('sizer'), canvas = $('view'), overlay = $('overlay');
  const pxPerTwip = () => S.zoom / 15;
  const MARGIN = 0;
  function layout() {
    const k = pxPerTwip();
    sizer.style.width = Math.max(scroller.clientWidth, Math.ceil(S.size[0] * k) + MARGIN) + 'px';
    sizer.style.height = Math.max(scroller.clientHeight, Math.ceil(S.size[1] * k) + MARGIN) + 'px';
    overlay.style.width = sizer.style.width; overlay.style.height = sizer.style.height;
    drawOverlay();
    schedulePaint();
  }
  let paintPending = false, painting = false;
  function schedulePaint() { if (paintPending) return; paintPending = true; setTimeout(() => { paintPending = false; paint(); }, 16); }
  async function paint() {
    if (!doc) return;
    if (painting) { schedulePaint(); return; }
    painting = true;
    try {
      const dpr = window.devicePixelRatio || 1;
      const cw = scroller.clientWidth, ch = scroller.clientHeight, sl = scroller.scrollLeft, st = scroller.scrollTop;
      const pw = Math.max(1, Math.round(cw * dpr)), ph = Math.max(1, Math.round(ch * dpr));
      const tw = Math.round(cw / pxPerTwip()), th = Math.round(ch / pxPerTwip()), tx = Math.round(sl / pxPerTwip()), ty = Math.round(st / pxPerTwip());
      const px = await queue(async () => {
        if (S.docType === 1) await dcall(D.setClientVisibleArea, tx, ty, tw, th);
        const buf = W._malloc(pw * ph * 4);
        try { await dcall(D.paintTile, buf, pw, ph, tx, ty, tw, th); return HEAPU8.slice(buf, buf + pw * ph * 4); }
        finally { W._free(buf); }
      });
      for (let i = 0; i < px.length; i += 4) { const b = px[i]; px[i] = px[i + 2]; px[i + 2] = b; }   // BGRA → RGBA
      canvas.width = pw; canvas.height = ph;
      canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
      canvas.style.left = sl + 'px'; canvas.style.top = st + 'px';
      canvas.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(px.buffer), pw, ph), 0, 0);
      window.__loPaints = (window.__loPaints || 0) + 1;
      if (S.docType === 1) await drawHeaders(tx, ty, tw, th);
    } catch (e) { say('paint failed: ' + ((e && e.message) || e)); }
    finally { painting = false; }
  }
  // ---- Calc: row / column headers (LibreOffice's own geometry, .uno:ViewRowColumnHeaders) ----
  const HDR_W = 44, HDR_H = 20;
  const hdr = { cols: [], rows: [], unit: 1 };   // spans [{ label, from, to }] in twips
  const isNum = (t) => /^[0-9]+$/.test(t);
  function colNum(t) { let n = 0; for (const ch of String(t).toUpperCase()) n = n * 26 + (ch.charCodeAt(0) - 64); return n; }
  function colName(n) { let t = ''; while (n > 0) { const m = (n - 1) % 26; t = String.fromCharCode(65 + m) + t; n = (n - 1 - m) / 26; } return t; }
  // [{text, size}]: "size" is where the labelled row/column ends; an entry may close a run of
  // equal-sized rows/columns (LibreOffice skips repeats), so split runs evenly
  function spans(list, unit) {
    const out = []; let prevEnd = null, prevNum = null;
    for (const e of list || []) {
      const end = Number(e.size) * unit, label = String(e.text), num = isNum(label) ? +label : colNum(label);
      if (prevEnd != null) {
        const n = Math.max(1, num - prevNum), step = (end - prevEnd) / n;
        for (let i = 1; i <= n; i++) out.push({ label: isNum(label) ? String(prevNum + i) : colName(prevNum + i), from: prevEnd + step * (i - 1), to: prevEnd + step * i });
      } else out.push({ label, from: null, to: end });
      prevEnd = end; prevNum = num;
    }
    if (out.length > 1 && out[0].from == null) out[0].from = out[0].to - (out[1].to - out[1].from);
    return out.filter((x) => x.from != null);
  }
  async function drawHeaders(tx, ty, tw, th) {
    let j;
    try {
      const txt = await queue(async () => {
        const p = await withStrs(['.uno:ViewRowColumnHeaders?x=' + tx + '&y=' + ty + '&width=' + tw + '&height=' + th], (c) => dcall(D.getCommandValues, c));
        const t = p ? UTF8ToString(p) : ''; if (p) W._free(p); return t;
      });
      j = JSON.parse(txt || '{}');
    } catch (e) { say('headers: ' + ((e && e.message) || e)); return; }
    window.__loHeaders = j;
    // sizes come in LibreOffice's 100% pixels (15 twips each) unless they are already twips
    const lastCol = (j.columns || []).slice(-1)[0];
    hdr.unit = lastCol && Number(lastCol.size) > tx + tw * 1.5 ? 1 : 15;
    hdr.cols = spans(j.columns, hdr.unit); hdr.rows = spans(j.rows, hdr.unit);
    const dpr = window.devicePixelRatio || 1, k = pxPerTwip(), css = getComputedStyle(document.body);
    const fg = css.getPropertyValue('--mut').trim() || '#666', line = css.getPropertyValue('--line').trim() || '#ccc';
    const prep = (c, w, h) => { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); c.style.width = w + 'px'; c.style.height = h + 'px'; const g = c.getContext('2d'); g.scale(dpr, dpr); g.font = '11px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = fg; g.strokeStyle = line; return g; };
    const cw = scroller.clientWidth, ch = scroller.clientHeight;
    const gc = prep($('colhdr'), cw, HDR_H);
    for (const c of hdr.cols) { const a = (c.from - tx) * k, b = (c.to - tx) * k; if (b < 0 || a > cw) continue; gc.beginPath(); gc.moveTo(Math.round(b) + 0.5, 0); gc.lineTo(Math.round(b) + 0.5, HDR_H); gc.stroke(); if (b - a > 14) gc.fillText(c.label, (a + b) / 2, HDR_H / 2); }
    gc.beginPath(); gc.moveTo(0, HDR_H - 0.5); gc.lineTo(cw, HDR_H - 0.5); gc.stroke();
    const gr = prep($('rowhdr'), HDR_W, ch);
    for (const r of hdr.rows) { const a = (r.from - ty) * k, b = (r.to - ty) * k; if (b < 0 || a > ch) continue; gr.beginPath(); gr.moveTo(0, Math.round(b) + 0.5); gr.lineTo(HDR_W, Math.round(b) + 0.5); gr.stroke(); if (b - a > 9) gr.fillText(r.label, HDR_W / 2, (a + b) / 2); }
    gr.beginPath(); gr.moveTo(HDR_W - 0.5, 0); gr.lineTo(HDR_W - 0.5, ch); gr.stroke();
    prep($('corner'), HDR_W, HDR_H);
  }
  // a click on a header selects that column / row
  const hdrAt = (list, t) => list.find((x) => t >= x.from && t < x.to);
  $('colhdr').addEventListener('mousedown', async (e) => {
    e.preventDefault(); const c = hdrAt(hdr.cols, (scroller.scrollLeft + e.offsetX) / pxPerTwip()); if (!c) return;
    await uno('.uno:GoToCell', { ToPoint: { type: 'string', value: c.label + '1' } }); await uno('.uno:SelectColumn'); $('ime').focus({ preventScroll: true });
  });
  $('rowhdr').addEventListener('mousedown', async (e) => {
    e.preventDefault(); const r = hdrAt(hdr.rows, (scroller.scrollTop + e.offsetY) / pxPerTwip()); if (!r) return;
    await uno('.uno:GoToCell', { ToPoint: { type: 'string', value: 'A' + r.label } }); await uno('.uno:SelectRow'); $('ime').focus({ preventScroll: true });
  });
  // ---- Calc: formula bar --------------------------------------------------------------
  const addr = $('addr'), formula = $('formula');
  const backToSheet = (el) => { el.blur(); $('ime').focus({ preventScroll: true }); };
  formula.addEventListener('keydown', async (e) => {
    if (e.key === 'Enter') { e.preventDefault(); await uno('.uno:EnterString', { StringName: { type: 'string', value: formula.value } }); backToSheet(formula); }
    else if (e.key === 'Escape') { e.preventDefault(); formula.value = formula.dataset.v || ''; backToSheet(formula); }
  });
  addr.addEventListener('keydown', async (e) => {
    if (e.key === 'Enter') { e.preventDefault(); await uno('.uno:GoToCell', { ToPoint: { type: 'string', value: addr.value.trim() } }); backToSheet(addr); }
    else if (e.key === 'Escape') { e.preventDefault(); addr.value = addr.dataset.v || ''; backToSheet(addr); }
  });

  scroller.addEventListener('scroll', schedulePaint);
  new ResizeObserver(() => { if (doc) layout(); }).observe(scroller);

  let booted = null, current = null;
  window.addEventListener('message', async (e) => {
    const d = e.data; if (!d || e.source !== parent) return;
    if (d.type === 'lok-open') {
      const prev = current;
      current = (async () => {
        try { await prev; } catch (_) {}
        docId = d.docId;
        try {
          if (!booted) booted = boot();
          await booted;
          await closeDoc();
          const r = await openDoc(String(d.name || 'document'), d.bytes);
          post(Object.assign({ type: 'lok-opened', docId: d.docId }, r));
        } catch (err) { fail(String((err && err.message) || err)); throw err; }
      })();
      return;
    }
    if (d.type === 'lok-close') {
      const prev = current;
      current = (async () => { try { await prev; } catch (_) {} await closeDoc(); docId = null; })();
      return;
    }
    if (d.type === 'lok-call') {
      try {
        if (!current) throw new Error('no document is open');
        await current;
        if (!doc) throw new Error('no document is open');
        const f = ops[d.op]; if (!f) throw new Error('unknown operation ' + d.op);
        const v = await f(d.args || {});
        if (v && v.bytes) post({ type: 'lok-reply', id: d.id, ok: true, value: { name: v.name }, bytes: v.bytes }, [v.bytes]);
        else post({ type: 'lok-reply', id: d.id, ok: true, value: v });
        if (d.op !== 'save' && d.op !== 'read') schedulePaint();
      } catch (err) { post({ type: 'lok-reply', id: d.id, ok: false, error: String((err && err.message) || err) }); }
    }
  });
  // test hooks
  window.__lok = { state: S, ov, ops, key, uno, paint, selectionText };
  post({ type: 'lok-ready' });
  const s = document.createElement('script');
  s.src = BIN + 'soffice.js?v=' + V;
  s.onerror = () => fail('could not load LibreOffice');
  document.body.appendChild(s);
})();
</script>
